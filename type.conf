# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# hermes: Hermes Agent (Nous Research). External type plugin that replaces the
# built-in `hermes` type (manual inbox checks only) with one that also has a
# monitor mode. A trusted plugin of the same name overrides the built-in, so
# the registered type stays `hermes`.
#
# Hermes has no Monitor-style tool that streams a command's stdout line by
# line. What it does have is terminal(background=true, notify_on_complete=true):
# when such a process exits, Hermes starts a new turn in a session that has a
# viewer attached (CLI / TUI). Delivery therefore runs a one-shot watcher
# (hermes-watch.sh) in the background: it exits as soon as unread messages
# exist, and the agent reads them with inbox.sh and re-arms it.
# A shell hook on pre_llm_call (hermes-hook.sh, registered in
# ~/.hermes/config.yaml by hermes-install.sh) asks the agent to start the
# watcher whenever none is running. Per-project opt-in is the marker file named
# by hooks_file.
name=hermes
template=template.md
cli=hermes
# spawnable=yes deliberately omitted, as in the built-in: the hermes CLI has no
# mode that starts an interactive session pre-seeded with an initial prompt.
detect=HERMES_SESSION_ID
session_env=HERMES_SESSION_ID
hooks_file=.hermes/agmsg-delivery
readiness_sentinel=no
delivery_modes=monitor off
